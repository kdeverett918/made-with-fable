services:
  - type: web
    name: made-with-fable
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/kdeverett918/made-with-fable
    branch: main
    # npm install (not ci): npm's lockfile bug skips wasm32-side optional deps
    # (@emnapi/*) when the lock is generated on Windows, which breaks npm ci on linux
    buildCommand: npm install --include=dev && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: NEXT_PUBLIC_SITE_URL
        value: https://madewithfable.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        value: kdeverett918@gmail.com
