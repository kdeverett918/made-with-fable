name: storage-cleanup

on:
  schedule:
    # weekly, Sunday 10:00 UTC — after the backup
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  orphans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete orphaned storage objects
        env:
          SUPABASE_URL: https://hzmqftoaolwjlmibomou.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-orphans.mjs
